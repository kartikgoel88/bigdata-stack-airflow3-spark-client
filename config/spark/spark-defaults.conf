# Spark Default Configuration
# This file contains default Spark settings for the Spark client

# Spark Master URL (can be overridden via environment variable)
spark.master                    spark://spark-master:7077

# Application name
spark.app.name                  Airflow Spark Client

# Driver settings
spark.driver.memory              1g
spark.driver.maxResultSize       2g

# Executor settings
spark.executor.memory            2g
spark.executor.cores             2

# Network settings
spark.network.timeout            300s
spark.executor.heartbeatInterval 30s

# Serialization
spark.serializer                 org.apache.spark.serializer.KryoSerializer

# Logging
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory    hdfs://namenode:9000/spark-logs

# PySpark
spark.pyspark.python            python3
spark.pyspark.driver.python     python3

