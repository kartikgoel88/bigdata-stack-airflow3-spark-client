[core]
# Note: airflow_home is set via AIRFLOW_HOME environment variable, not in config file
# The folder where your airflow DAGs are stored
dags_folder = /opt/airflow/dags

# The folder where airflow should store its log files
base_log_folder = /opt/airflow/logs

# Users must supply a password
authenticate = False

# The amount of parallelism as a setting to the executor
parallelism = 32

# The number of task instances allowed to run concurrently by the scheduler
dag_concurrency = 16

# Are DAGs paused by default at creation
dags_are_paused_at_creation = True

# Maximum number of active DAG runs, per DAG
max_active_runs_per_dag = 16

# Whether to load the examples that ship with Airflow
load_examples = False

# Where your Airflow plugins are stored
plugins_folder = /opt/airflow/plugins

# The executor class that airflow should use
executor = LocalExecutor

# The SqlAlchemy connection string to the metadata database
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

# Default timezone
default_timezone = UTC

[api]
# The base url of your API server
base_url = http://localhost:8082

# The ip specified when starting the API server
api_server_host = 0.0.0.0

# The port on which to run the API server
api_server_port = 8080

# Number of workers to run the Gunicorn API server
workers = 4

# The worker class gunicorn should use
worker_class = sync

# Expose the configuration file in the API server
expose_config = True

# Set to true to turn on authentication
auth_backends = airflow.api.auth.backend.basic_auth

# Default DAG view
default_dag_view = tree

# Default DAG orientation
dag_orientation = LR

[api_auth]
# JWT secret key for API authentication (required in Airflow 3.x)
# For production, use a secure random key. This is a development key.
jwt_secret = development-jwt-secret-key-change-in-production

[scheduler]
# The scheduler can run multiple threads in parallel to schedule dags
max_threads = 2

# The scheduler will randomly trigger a dag run at intervals
scheduler_heartbeat_sec = 5

[operators]
# The default owner assigned to each new operator
default_owner = Airflow

[admin]
# UI to hide sensitive variable fields
hide_sensitive_variable_fields = True

[logging]
# Logging level
logging_level = INFO

# Logging format
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

