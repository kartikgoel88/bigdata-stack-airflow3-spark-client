# Job Configuration for Airflow DAG
# This YAML file defines jobs with their dependencies and execution details
#
# Dependency Types Supported:
# 1. Internal Dependencies: References to other jobs in this DAG (e.g., "job_001")
# 2. External Dependencies: Dependencies on external systems or other DAGs
#    - external_task_sensor: Wait for a task in another DAG
#    - file_sensor: Wait for a file to appear in storage (S3, HDFS, etc.)
#    - http_sensor: Wait for an external API/service to be ready
#    - sql_sensor: Wait for data to be available in an external database
#
# Note: External dependency operators require additional implementation in the DAG code
# to create the appropriate sensor operators (ExternalTaskSensor, FileSensor, etc.)

jobs:
  # Job 1: Entry point - no dependencies
  - id: job_001
    name: "Data Extraction Job"
    operator: "bash"
    command: "echo 'Extracting data from source' && sleep 2"
    dependencies: []
    
  # Job 2: Depends on job_001 (1-to-1)
  - id: job_002
    name: "Data Validation Job"
    operator: "bash"
    command: "echo 'Validating extracted data' && sleep 2"
    dependencies:
      - job_001
    
  # Job 3: Depends on job_001 (1-to-1, parallel with job_002)
  - id: job_003
    name: "Data Transformation Job A"
    operator: "bash"
    command: "echo 'Transforming data - branch A' && sleep 2"
    dependencies:
      - job_001
    
  # Job 4: Depends on job_002 (1-to-1)
  - id: job_004
    name: "Data Enrichment Job"
    operator: "bash"
    command: "echo 'Enriching validated data' && sleep 2"
    dependencies:
      - job_002
    
  # Job 5: Depends on job_003 (1-to-1)
  - id: job_005
    name: "Data Transformation Job B"
    operator: "bash"
    command: "echo 'Transforming data - branch B' && sleep 2"
    dependencies:
      - job_003
    
  # Job 6: Depends on multiple jobs (many-to-1) - job_002 and job_003
  - id: job_006
    name: "Data Aggregation Job"
    operator: "spark"
    application: "/path/to/spark/aggregation.py"
    master: "spark://spark-master:7077"
    dependencies:
      - job_002
      - job_003
    
  # Job 7: Depends on multiple jobs (many-to-1) - job_004 and job_005
  - id: job_007
    name: "Data Merge Job"
    operator: "spark"
    application: "/path/to/spark/merge.py"
    master: "spark://spark-master:7077"
    dependencies:
      - job_004
      - job_005
    
  # Job 8: Depends on multiple jobs (many-to-1) - job_006 and job_007
  - id: job_008
    name: "Final Processing Job"
    operator: "spark"
    application: "/path/to/spark/final_process.py"
    master: "spark://spark-master:7077"
    dependencies:
      - job_006
      - job_007
    
  # Job 9: Depends on job_008 (1-to-1)
  - id: job_009
    name: "Data Quality Check Job"
    operator: "bash"
    command: "echo 'Running quality checks' && sleep 2"
    dependencies:
      - job_008
    
  # Job 10: Depends on multiple jobs (many-to-1) - job_008 and job_009
  - id: job_010
    name: "Data Loading Job"
    operator: "bash"
    command: "echo 'Loading processed data to destination' && sleep 2"
    dependencies:
      - job_008
      - job_009

  # ============================================================================
  # External Dependencies Examples
  # ============================================================================
  
  # Job 11: External DAG dependency - waits for another DAG's task to complete
  # This job depends on a task from a different DAG (e.g., upstream ETL pipeline)
  - id: job_011
    name: "Wait for External ETL Pipeline"
    operator: "external_task_sensor"
    external_dag_id: "upstream_etl_pipeline"
    external_task_id: "data_ingestion_complete"
    timeout: 3600  # Wait up to 1 hour
    poke_interval: 60  # Check every 60 seconds
    dependencies:
      - job_010
  
  # Job 12: External file dependency - waits for a file to appear in storage
  # This job waits for an external file (e.g., S3, HDFS, or local filesystem)
  - id: job_012
    name: "Wait for External Data File"
    operator: "file_sensor"
    filepath: "/data/external/input/daily_export.csv"
    fs_conn_id: "fs_default"  # Filesystem connection (S3, HDFS, etc.)
    timeout: 7200  # Wait up to 2 hours
    poke_interval: 120  # Check every 2 minutes
    dependencies:
      - job_011
  
  # Job 13: External API dependency - waits for external API to be ready
  # This job waits for an external service/API to be available
  - id: job_013
    name: "Wait for External API Service"
    operator: "http_sensor"
    http_conn_id: "external_api"
    endpoint: "/health"
    timeout: 1800  # Wait up to 30 minutes
    poke_interval: 30  # Check every 30 seconds
    dependencies:
      - job_011
  
  # Job 14: External database dependency - waits for database table to be ready
  # This job waits for data to be available in an external database
  - id: job_014
    name: "Wait for External Database Table"
    operator: "sql_sensor"
    conn_id: "external_db"
    sql: "SELECT COUNT(*) FROM staging.raw_data WHERE date = CURRENT_DATE"
    timeout: 3600  # Wait up to 1 hour
    poke_interval: 60  # Check every 60 seconds
    dependencies:
      - job_011
  
  # Job 15: Depends on both external file and external DAG (many-to-1 with external deps)
  # This job waits for multiple external dependencies before proceeding
  - id: job_015
    name: "Process External Data Sources"
    operator: "spark"
    application: "/path/to/spark/process_external.py"
    master: "spark://spark-master:7077"
    dependencies:
      - job_012  # External file dependency
      - job_013  # External API dependency
      - job_014  # External database dependency
  
  # Job 16: Mixed dependencies - internal job + external DAG dependency
  # This job depends on both internal jobs and external DAG completion
  - id: job_016
    name: "Final Aggregation with External Data"
    operator: "spark"
    application: "/path/to/spark/final_aggregation.py"
    master: "spark://spark-master:7077"
    dependencies:
      - job_015  # Internal dependency
      - job_011  # External DAG dependency (already completed)

# DAG Configuration
dag_config:
  dag_id: "yaml_based_jobs"
  description: "DAG with 10 jobs defined in YAML - runs 3 times a day"
  schedule: "0 */8 * * *"  # Every 8 hours = 3 times a day (00:00, 08:00, 16:00)
  start_date: "2024-01-01"
  catchup: false
  tags:
    - "yaml-config"
    - "3x-daily"
    - "10-jobs"

